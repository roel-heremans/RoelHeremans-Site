name: Deploy (GitHub Pages test site + STRATO live site)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: ./build-output.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  strato:
    # Live site (roel-heremans.com). Off until the repo variable STRATO_DEPLOY is "true".
    needs: build
    if: vars.STRATO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: strato
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: SITE_ENV=production ./build-output.sh
      - run: python tools/deploy_strato.py output
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_REMOTE_PATH: ${{ vars.STRATO_REMOTE_PATH }}
